[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-benchy-viz-tui"
version = "0.1.0"
description = "Live terminal dashboard for llama-benchy benchmarks. Consumes the --emit-progress JSONL stream."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alex Ziskind" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
keywords = ["llm", "benchmarking", "tui", "dashboard", "rich", "llama-benchy"]
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
llama-benchy-viz-tui = "llama_benchy_viz_tui.__main__:main"

[project.urls]
"Homepage" = "https://github.com/alexziskind1/llama-benchy-viz-tui"
"Issues" = "https://github.com/alexziskind1/llama-benchy-viz-tui/issues"
"Upstream tool" = "https://github.com/eugr/llama-benchy"
"Schema" = "https://github.com/eugr/llama-benchy/blob/main/docs/progress-schema.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_benchy_viz_tui"]
